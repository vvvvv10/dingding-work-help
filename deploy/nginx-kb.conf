# kb.smartwork-inc.me —— 钉钉群知识问答（手机版 /m，桌面版 /ask，管理后台 /）
# 反代到本机 127.0.0.1:8017（systemd: kb-admin）。证书由 acme.sh webroot 签发并自动续期。

server {
    listen       80;
    listen       [::]:80;
    server_name  kb.smartwork-inc.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    server_name  kb.smartwork-inc.me;

    ssl_certificate     /etc/nginx/ssl/kb.smartwork-inc.me/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kb.smartwork-inc.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 页面不缓存，重新部署后立刻生效；问答接口本身也不该被中间层缓存
    add_header Cache-Control "no-store" always;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8017;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大模型生成回答可能要十几秒，别让网关先断
        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;
        proxy_buffering off;
    }
}
